name: Publish to PyPI

# Trigger on any tag matching vX.Y.Z (e.g. v0.1.0), pushed after the
# version in pyproject.toml has already been bumped and committed.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    # Required: create a "pypi" Environment (Settings -> Environments) with
    # required reviewers, and register that same environment name on the
    # PyPI trusted-publisher config (see RELEASING.md). Without this, anyone
    # who can push a v* tag can trigger a real publish with no human gate.
    environment: pypi
    permissions:
      # Job-level `permissions:` replaces the workflow-level block entirely
      # (it does not merge), so contents: read must be repeated here or
      # actions/checkout silently runs with contents: none.
      contents: read
      # Required for PyPI Trusted Publishing (OIDC) — no PYPI_API_TOKEN needed.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install "build==1.5.0" "twine==7.0.0"

      - name: Build sdist and wheel
        run: python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1 (v1.14.2)
