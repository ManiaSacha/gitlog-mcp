[build-system]
requires = ["setuptools>=68,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "gitlog-mcp"
version = "0.1.3"
description = "Give AI agents superpowers over git history — changelogs, commit analysis, blame, and release notes via MCP."
readme = "README.md"
dependencies = [
    "mcp>=1.0,<2.0",
]
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ManiaSacha" }]
keywords = ["mcp", "mcp-server", "ai-agents", "git", "developer-tools", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Version Control",
]

[project.urls]
Homepage = "https://github.com/ManiaSacha/gitlog-mcp"
Repository = "https://github.com/ManiaSacha/gitlog-mcp"
Issues = "https://github.com/ManiaSacha/gitlog-mcp/issues"

[project.optional-dependencies]
test = ["pytest>=7.0"]
ui = []

[project.scripts]
gitlog-mcp = "gitlog_mcp:main"
gitlog-mcp-ui = "gitlog_mcp_ui:main"
git-pipeline-agent = "git_pipeline_agent:main"

[tool.setuptools]
py-modules = ["gitlog_mcp", "gitlog_mcp_ui", "git_pipeline_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
